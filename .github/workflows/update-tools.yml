# Bot that keeps the vendored binaries in tools/ up to date.
#
# Compares tools/upx.exe and tools/7zr.exe against the latest STABLE release of
# upx/upx and ip7z/7zip. When there is something new it downloads the asset,
# verifies its SHA256 against the digest GitHub publishes for that asset, checks
# the PE architecture, runs a real functional test with the same flags the release
# pipeline uses, and only then opens a PR with the binary and
# tools/tools.lock.json updated.
#
# All the logic lives in tools/Update-VendoredTools.ps1, which can be run by hand:
#   pwsh tools/Update-VendoredTools.ps1 -CheckOnly
#
# REQUIRED SETTING: Settings > Actions > General > Workflow permissions >
# "Allow GitHub Actions to create and approve pull requests" must be enabled, or
# `gh pr create` fails with 403.

name: Update vendored tools

on:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      tool:
        description: 'Which tool to check'
        type: choice
        options: [all, upx, 7zr]
        default: all
      check_only:
        description: 'Only report the comparison; do not download or open a PR'
        type: boolean
        default: false

permissions:
  contents: read

# Two concurrent runs would push the same branch. The in-flight one is not
# cancelled: it may be halfway through a push.
concurrency:
  group: update-tools
  cancel-in-progress: false

jobs:
  discover:
    name: Read tools.lock.json
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build the tool matrix
        id: set
        shell: pwsh
        run: |
          $lock = Get-Content tools/tools.lock.json -Raw | ConvertFrom-Json
          $requested = '${{ inputs.tool }}'
          if ([string]::IsNullOrWhiteSpace($requested)) { $requested = 'all' }  # scheduled runs

          # Outer @(): an if branch returning an empty array collapses to $null on
          # assignment, and the .Count check below would stop catching it.
          $ids = @(if ($requested -eq 'all') { $lock.tools | ForEach-Object { $_.id } } else { $requested })
          if ($ids.Count -eq 0) { throw "tools.lock.json defines no tools." }

          $matrix = '{"id":' + ($ids | ConvertTo-Json -Compress -AsArray) + '}'
          Write-Host "matrix: $matrix"
          "matrix=$matrix" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  update:
    name: ${{ matrix.id }}
    needs: discover
    # windows-latest is required: the functional test executes the .exe files.
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Compare against upstream and update the binary
        id: update
        shell: pwsh
        env:
          # Only for the GitHub API rate limit (60 req/h per IP without a token).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $p = @{ Id = '${{ matrix.id }}'; PrBodyPath = "$env:RUNNER_TEMP/pr-body.md" }
          if ('${{ inputs.check_only }}' -eq 'true') { $p['CheckOnly'] = $true }
          ./tools/Update-VendoredTools.ps1 @p

      - name: Look for an existing PR for this version
        id: existing
        if: steps.update.outputs.updated == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $branch = 'bot/update-${{ matrix.id }}-${{ steps.update.outputs.latest_version }}'
          "branch=$branch" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          # --state all on purpose: if a PR for this exact version was already
          # closed, the maintainer decided, and the bot should not nag.
          $prs = @(gh pr list --head $branch --state all --json url,state --limit 5 | ConvertFrom-Json)
          if ($prs.Count -gt 0) {
            Write-Host "::notice::A PR for $branch already exists ($($prs[0].state)): $($prs[0].url)"
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Open the pull request
        id: pr
        if: steps.update.outputs.updated == 'true' && steps.existing.outputs.skip == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $branch = '${{ steps.existing.outputs.branch }}'
          $name   = '${{ steps.update.outputs.name }}'
          $old    = '${{ steps.update.outputs.current_version }}'
          $new    = '${{ steps.update.outputs.latest_version }}'
          $path   = '${{ steps.update.outputs.path }}'

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b $branch

          # Explicit paths: .gitignore covers *.exe and nothing beyond the binary
          # and the lock should be staged.
          git add -- $path tools/tools.lock.json
          $staged = @(git diff --cached --name-only)
          if ($staged.Count -eq 0) {
            throw "Nothing was staged. Expected $path and tools/tools.lock.json."
          }
          Write-Host "staged: $($staged -join ', ')"

          $title = "chore(tools): $name $old -> $new"
          git commit -m $title -m "Upstream: ${{ steps.update.outputs.release_url }}" -m "SHA256: ${{ steps.update.outputs.sha256_new }}"
          git push --set-upstream origin $branch

          # The body was generated by the script in the previous step (New-PrBody).
          $body = "$env:RUNNER_TEMP/pr-body.md"
          if (-not (Test-Path $body)) { throw "PR body missing at $body." }
          $url = gh pr create --base main --head $branch --title $title --body-file $body
          Write-Host "::notice::PR created: $url"
          "url=$url" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          $hasUpdate = '${{ steps.update.outputs.has_update }}' -eq 'true'
          $updated   = '${{ steps.update.outputs.updated }}' -eq 'true'
          $skipped   = '${{ steps.existing.outputs.skip }}' -eq 'true'
          $verified  = '${{ steps.update.outputs.digest_verified }}' -eq 'true'
          $old = '${{ steps.update.outputs.current_version }}'
          $new = '${{ steps.update.outputs.latest_version }}'

          # One if/elseif per line: PowerShell rejects a newline between "}" and
          # "elseif".
          $status = '⚠️ Did not complete, check the log'
          if (-not $hasUpdate) { $status = "✅ Up to date (``$old``)" }
          elseif ('${{ inputs.check_only }}' -eq 'true') { $status = "🔍 ``$new`` is available (check_only, no PR opened)" }
          elseif ($skipped) { $status = "⏭️ A PR for ``$new`` already exists" }
          elseif ($updated) { $status = "🚀 PR opened: ``$old`` → ``$new`` — ${{ steps.pr.outputs.url }}" }

          "## ${{ matrix.id }}" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          ""                    | Out-File $env:GITHUB_STEP_SUMMARY -Append
          $status               | Out-File $env:GITHUB_STEP_SUMMARY -Append
          if ($updated) {
            $checksum = if ($verified) { 'verified against the digest GitHub publishes' } else { '**NOT verified** (no digest published)' }
            ""                            | Out-File $env:GITHUB_STEP_SUMMARY -Append
            "- Checksum: $checksum"        | Out-File $env:GITHUB_STEP_SUMMARY -Append
            "- Asset SHA256: ``${{ steps.update.outputs.asset_sha256 }}``" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          }
